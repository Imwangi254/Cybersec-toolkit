[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.0.1"
description = "Authorization + audit control plane for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]
keywords = ["ai", "agents", "security", "authorization", "audit", "llm", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # core is pure-Python and dependency-free by design

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://example.com/agentgate"
Source = "https://github.com/your-org/agentgate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
